kind: Breaking
body: 'a table fails only when its unprunable statements also take `exec_time_fail_minutes_per_day` (default 5 minutes) of execution time a day, worked out per statement from `stats_since` on PostgreSQL 17 and from the last reset before it; below that it warns. The daily time follows the totals of each table in `partition-key-unused` and fills a new Time/Day column in `join-missing-partition-key`. `partitionusage.New` takes a `partitionusage.Config`'
